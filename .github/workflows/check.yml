# 푸시·PR 마다: 타입 검사 → 단위 테스트 → 빌드(+커밋된 배포본이 최신인지) → 브라우저 테스트
# 배포는 GitHub Pages 가 main 브랜치 루트(index.html, onetouch/index.html)에서 한다.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: 배포본이 소스와 일치하는지 (npm run build 후 커밋했는지)
        run: |
          if ! git diff --quiet -- index.html onetouch/index.html; then
            echo "::error::index.html 이 src 와 다릅니다. 'npm run build' 후 결과를 같이 커밋하세요."
            git diff --stat -- index.html onetouch/index.html
            exit 1
          fi
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저 테스트
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
